<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxPad - 3D Engine</title>
    
    <!-- Scripts CDN de Alta Compatibilidade carregados na ordem correta -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    
    <style>
        :root { --bg: #0a0b10; --panel: #12131a; --blue: #00f0ff; --green: #39ff14; }
        * { box-sizing: border-box; }
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; background: var(--bg); color: white; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 0 20px; height: 60px; border-bottom: 2px solid #1f2330; }
        .logo { font-size: 20px; font-weight: bold; color: var(--blue); letter-spacing: 2px; }
        .btn-run { padding: 10px 20px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; background: var(--green); color: #000; box-shadow: 0 0 15px rgba(57,255,20,0.4); }
        main { display: flex; flex: 1; height: calc(100vh - 60px); width: 100vw; }
        #bloco-area { width: 50%; height: 100%; background: #181920; }
        #jogo-container { width: 50%; height: 100%; background: #050508; position: relative; }
        .blocklyTreeLabel { color: #fff !important; }
        .blocklyToolboxDiv { background-color: var(--panel) !important; }
    </style>
</head>
<body>

    <header>
        <div class="logo">VOXPAD ENGINE 🚀</div>
        <button class="btn-run" id="btn-rodar">RODAR CÓDIGO ⚡</button>
    </header>
    
    <main>
        <div id="bloco-area"></div>
        <div id="jogo-container"></div>
    </main>

    <!-- Caixa de ferramentas do VoxPad -->
    <xml id="toolbox" style="display: none">
        <category name="📦 FORMAS 3D" colour="#00f0ff">
            <block type="criar_cubo"></block>
            <block type="criar_chao"></block>
        </category>
        <category name="🔄 MOVIMENTO" colour="#39ff14">
            <block type="rodar_objeto"></block>
        </category>
    </xml>

    <script>
        // Esta função garante que o script só corre DEPOIS das divs estarem prontas no iPad
        window.onload = function() {
            const container = document.getElementById('jogo-container');
            const cena = new THREE.Scene();
            
            // Configuração do Visualizador 3D
            const camara = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderizador = new THREE.WebGLRenderer({ antialias: true });
            renderizador.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderizador.domElement);
            
            camara.position.set(0, 5, 8); 
            camara.lookAt(0, 0, 0);
            
            // Luzes e Grelha Neon
            const luzSol = new THREE.DirectionalLight(0xffffff, 1.2); 
            luzSol.position.set(10, 20, 10); 
            cena.add(luzSol);
            cena.add(new THREE.AmbientLight(0x1a1a2e));
            cena.add(new THREE.GridHelper(40, 40, 0x00f0ff, 0x1f2330));
            
            let oMeuCubo = null; 
            let deveRodar = false;
            
            // Loop de Animação Real-time
            function animar() {
                requestAnimationFrame(animar);
                if(oMeuCubo && deveRodar) { 
                    oMeuCubo.rotation.x += 0.01; 
                    oMeuCubo.rotation.y += 0.02; 
                }
                renderizador.render(cena, camara);
            }
            animar();

            // Ajustar o tamanho se mudar a orientação do iPad
            window.addEventListener('resize', () => {
                renderizador.setSize(container.clientWidth, container.clientHeight);
                camara.aspect = container.clientWidth / container.clientHeight;
                camara.updateProjectionMatrix();
            });

            // === DEFINIÇÃO DOS BLOCOS DO VOXPAD ===
            Blockly.Blocks['criar_cubo'] = { 
                init: function() {
                    this.appendDummyInput().appendField("Criar Cubo 3D 📦");
                    this.setPreviousStatement(true, null); 
                    this.setNextStatement(true, null); 
                    this.setColour("#00f0ff");
                }
            };
            Blockly.JavaScript['criar_cubo'] = function(block) {
                return `var geo = new THREE.BoxGeometry(1.5, 1.5, 1.5); var mat = new THREE.MeshNormalMaterial(); oMeuCubo = new THREE.Mesh(geo, mat); oMeuCubo.position.set(0, 0.75, 0); cena.add(oMeuCubo);\n`;
            };

            Blockly.Blocks['criar_chao'] = { 
                init: function() {
                    this.appendDummyInput().appendField("Adicionar Terreno 🏝️");
                    this.setPreviousStatement(true, null); 
                    this.setNextStatement(true, null); 
                    this.setColour("#00f0ff");
                }
            };
            Blockly.JavaScript['criar_chao'] = function(block) {
                return `var geo = new THREE.PlaneGeometry(40, 40); var mat = new THREE.MeshStandardMaterial({ color: 0x111218, roughness: 0.8 }); var mesh = new THREE.Mesh(geo, mat); mesh.rotation.x = -Math.PI / 2; cena.add(mesh);\n`;
            };

            Blockly.Blocks['rodar_objeto'] = { 
                init: function() {
                    this.appendDummyInput().appendField("Fazer Rodar 🔄");
                    this.setPreviousStatement(true, null); 
                    this.setNextStatement(true, null); 
                    this.setColour("#39ff14");
                }
            };
            Blockly.JavaScript['rodar_objeto'] = function(block) { 
                return `deveRodar = true;\n`; 
            };

            // Injetar o Blockly na div estrutural de forma segura
            const workspace = Blockly.inject('bloco-area', { 
                toolbox: document.getElementById('toolbox'), 
                trashcan: true 
            });

            // Executar a compilação dos blocos
            document.getElementById('btn-rodar').addEventListener('click', () => {
                while(cena.children.length > 3){ 
                    cena.remove(cena.children[cena.children.length-1]); 
                }
                oMeuCubo = null; 
                deveRodar = false;
                
                const codigo = Blockly.JavaScript.workspaceToCode(workspace);
                try { 
                    eval(codigo); 
                } catch(e) { 
                    console.error(e); 
                }
            });
        };
    </script>
</body>
</html>
